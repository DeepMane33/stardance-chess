<svg viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0.8" />
    </linearGradient>
    <filter id="brShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="brGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#brShadow)">
    <rect x="145" y="75" width="160" height="140" rx="10" fill="url(#brBody)" stroke="#0a0a0f" stroke-width="8" filter="url(#brGlow)"/>
    <rect x="165" y="75" width="30" height="30" fill="url(#brTop)"/>
    <rect x="255" y="75" width="30" height="30" fill="url(#brTop)"/>
    <rect x="130" y="215" width="190" height="20" rx="8" fill="url(#brTop)" opacity="0.8"/>
    <rect x="135" y="235" width="180" height="80" fill="url(#brBody)" stroke="#0a0a0f" stroke-width="8"/>
    <rect x="155" y="255" width="30" height="50" fill="#3a3a4e" opacity="0.2"/>
    <rect x="265" y="255" width="30" height="50" fill="#3a3a4e" opacity="0.2"/>
    <ellipse cx="225" cy="330" rx="85" ry="18" fill="url(#brTop)" opacity="0.8"/>
    <ellipse cx="225" cy="330" rx="70" ry="12" fill="#3a3a4e" opacity="0.4"/>
  </g>
</svg>