<svg viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bnBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bnAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0.9" />
    </linearGradient>
    <filter id="bnShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="bnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#bnShadow)">
    <path d="M180 80 Q180 65 200 60 Q235 55 250 95 Q265 125 260 155 Q255 180 230 195 Q205 210 190 200 Q175 190 170 170 Q155 150 160 130 Q170 110 180 80 Z" fill="url(#bnBody)" stroke="#0a0a0f" stroke-width="8" filter="url(#bnGlow)"/>
    <path d="M205 85 Q215 75 235 85" stroke="url(#bnAccent)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M210 115 Q220 125 245 135" stroke="url(#bnAccent)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="225" cy="210" rx="62" ry="22" fill="url(#bnAccent)" opacity="0.8"/>
    <ellipse cx="225" cy="210" rx="48" ry="16" fill="#3a3a4e" opacity="0.4"/>
    <path d="M165 210 L155 300 L295 300 L285 210 Z" fill="url(#bnBody)" stroke="#0a0a0f" stroke-width="8"/>
    <ellipse cx="225" cy="315" rx="82" ry="18" fill="url(#bnAccent)" opacity="0.8"/>
    <ellipse cx="225" cy="315" rx="68" ry="12" fill="#3a3a4e" opacity="0.4"/>
